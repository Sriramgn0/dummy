{% extends "base.html" %}
{% block title %}Add customer | Raju Printer{% endblock %}
{% block content %}
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>raju<span class="brand-thin">printer</span></span></a>
  <div class="topbar-right"><a class="button button-quiet order-back-link" href="{{ url_for('dashboard') }}">Order desk <span aria-hidden="true">↗</span></a><span class="admin-tag"><span class="admin-tag-dot"></span> ADMIN</span></div>
</header>
<main class="workspace customer-create-workspace">
  <div class="page-heading"><div><p class="eyebrow"><a class="breadcrumb-link" href="{{ url_for('dashboard') }}">ORDER DESK</a> <span class="eyebrow-divider">/</span> CUSTOMER ACCESS</p><h1>Add a customer login.</h1><p class="muted">Create their account and collect a delivery address and WhatsApp opt-in.</p></div></div>
  <form class="customer-form customer-create-form" method="post" action="{{ url_for('create_customer') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="customer-fields">
      <div class="field"><label for="customer-name">Customer name</label><input id="customer-name" name="name" type="text" maxlength="100" autocomplete="name" required></div>
      <div class="field"><label for="customer-username">Username</label><input id="customer-username" name="username" type="text" maxlength="60" autocomplete="username" required></div>
      <div class="field"><label for="customer-address">Default delivery address</label><textarea id="customer-address" name="address" rows="3" maxlength="500" autocomplete="street-address" required></textarea></div>
      <div class="field"><label for="customer-whatsapp">WhatsApp number</label><input id="customer-whatsapp" name="whatsapp_number" type="tel" pattern="\+[1-9][0-9]{7,14}" placeholder="+919876543210" required></div>
      <div class="field"><label for="customer-password">Temporary password</label><input id="customer-password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
      <label class="consent-check"><input type="checkbox" name="whatsapp_opt_in" value="yes" required><span>Customer agreed to WhatsApp order updates.</span></label>
      <button class="button button-primary" type="submit">Create customer login <span aria-hidden="true">↗</span></button>
    </div>
  </form>
</main>
{% endblock %}
